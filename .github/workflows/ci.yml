name: Agentic Infra CI/CD & REA-EGM Swarm Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic playwright fastapi uvicorn
          python -m playwright install --with-deps chromium

      - name: Execute Headless Chromium E2E Verification
        run: |
          python -m agentic_infra_core.deploy_verify
